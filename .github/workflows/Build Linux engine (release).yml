name: Build Linux engine (release)

on:
  push:
    branches: [linux-implicit-view-teardown-3.44.4]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: gclient sync
        run: |
          cat > .gclient <<EOF
          solutions = [
            {
              "name": ".",
              "url": "https://github.com/${{ github.repository }}.git@${{ github.sha }}",
              "deps_file": "DEPS",
              "managed": False,
              "custom_vars": {"download_emsdk": False},
            },
          ]
          EOF
          gclient sync --no-history -j4

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build clang

      - name: Build
        run: |
          cd engine/src
          flutter/tools/gn --no-goma --runtime-mode=release --target-dir host_release
          ninja -C out/host_release flutter/shell/platform/linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: host_release-linux-x64
          path: engine/src/out/host_release/libflutter_linux_gtk.so
          if-no-files-found: error
